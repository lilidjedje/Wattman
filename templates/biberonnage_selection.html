<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biberonnage — Choix de la durée</title>
    <script src="/static/biberonnage_profiles.js"></script>
    <link rel="stylesheet" href="/static/autonomy_profiles.css">
    <style>
        body { margin:0; padding:24px 16px; background:#edf3f7; color:#1f2937; font-family:"Segoe UI",sans-serif; }
        main { max-width:1100px; margin:0 auto; }
        .page-header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
        .btn-back { min-height:46px; border:1px solid #cbd5e1; border-radius:8px; padding:0 20px; background:white; color:#475569; font:inherit; font-weight:700; cursor:pointer; }
        h1 { color:#1f4e78; margin:0 0 6px; }
        .choices { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:24px; margin:28px 0; }
        .choice { display:block; padding:32px; border:1px solid #b7c9d6; border-radius:12px; background:white; color:#1f4e78; text-decoration:none; box-shadow:0 5px 18px #0f172a12; }
        .choice:hover,.choice:focus-visible { outline:2px solid #2563eb; }
        .choice strong { display:block; font-size:1.6rem; margin-bottom:12px; }
        .choice span { color:#475569; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='industrial-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='modern-ui.css') }}">
    <script src="/static/current_units.js"></script>
    <script src="/static/wattman_current.js"></script>
    <!-- Design system Renault Engineering -->
    <link rel="stylesheet" href="/static/design-system/tokens.css">
    <link rel="stylesheet" href="/static/design-system/components.css">
    <script src="/static/design-system/rg-ui.js"></script>
    <script src="/static/design-system/rg-grid.js" defer></script>
</head>
<body>
    <main>
        <header class="page-header">
            <button class="btn-back" type="button" onclick="window.location.href='/battery_menu'">← Retour (Menu Autonomie)</button>
            <div data-summary-slot></div>
        </header>
        <h1>Bilan de biberonnage</h1>
        <p id="days-help">Sélectionnez la durée à saisir pour le profil actif.</p>
        <div class="choices">
            <a class="choice" data-days="30" href="/biberonnage?days=30"><strong>30 jours</strong><span>Saisie des consommations et bilans sur 30 jours.</span></a>
            <a class="choice" data-days="90" href="/biberonnage?days=90"><strong>90 jours</strong><span>Saisie des consommations et bilans sur 90 jours.</span></a>
        </div>
    </main>
    <script src="/static/project_storage.js"></script>
    <script src="/static/app_summary.js" data-items="autonomy,battery,mode,pdf,home"></script>
    <script>
        // N'affiche que les durées étudiées par le profil (30 jours, 90 jours ou les deux).
        function showProfileDays(days) {
            document.querySelectorAll('.choice[data-days]').forEach(card => { card.hidden = !days.includes(Number(card.dataset.days)); });
        }
        showProfileDays(BiberonnageProfiles.days);
        window.addEventListener('biberonnage-profile-days', event => showProfileDays(event.detail.days));
    </script>
</body>
</html>
