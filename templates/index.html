<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Calculator Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='industrial-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='modern-ui.css') }}">
    <script src="/static/current_units.js"></script>
    <script src="/static/wattman_current.js"></script>
    <!-- Design system Renault Engineering -->
    <link rel="stylesheet" href="/static/design-system/tokens.css">
    <link rel="stylesheet" href="/static/design-system/components.css">
    <script src="/static/design-system/rg-ui.js"></script>
    <script src="/static/design-system/rg-grid.js" defer></script>
    <script src="/static/design-system/rg-hero3d.js" defer></script>
    <link rel="stylesheet" href="/static/design-system/hub.css">
    <style>
        @media screen {
        html body.rg-home { padding: var(--rg-appbar-h) 0 0 !important; min-height: 100vh; display: block; }
        .rg-home main.home#home-main {
            display: grid !important; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
            min-height: calc(100vh - var(--rg-appbar-h)); padding: 0 !important; margin: 0 !important;
            text-align: left; width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; overflow-x: clip;
        }
        .home-intro { display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: clamp(32px, 6vw, 88px); }
        .home-eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--rg-ink-3); font: 600 var(--rg-text-xs)/1 var(--rg-font-sans); letter-spacing: var(--rg-tracking-caps); text-transform: uppercase; }
        .home-eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--rg-yellow); }
        html body .home-intro h1 { margin: 0; font-size: clamp(2.2rem, 4.2vw, 3.6rem) !important; line-height: 1 !important; letter-spacing: -.035em !important; font-weight: 700; max-width: 13ch; }
        .home-intro { gap: 22px !important; }
        .home-lede { margin: 0; max-width: 52ch; color: var(--rg-ink-2); font-size: var(--rg-text-lg); line-height: 1.55; }
        .home-actions { display: flex; flex-wrap: wrap; gap: 12px; }
        html body .home-actions .action { min-height: 52px; padding: 14px 26px; font-size: 1rem !important; display: inline-flex; align-items: center; gap: 12px; }
        .home-actions .action svg { width: 18px; height: 18px; transition: transform var(--rg-dur-base) var(--rg-ease-out); }
        .home-actions .action:hover svg { transform: translateX(3px); }

        /* Boîte de dialogue des projets */
        dialog#project-dialog { width: min(720px, calc(100% - 32px)); padding: 28px; }
        dialog h2 { margin: 0 0 18px; text-align: left; }
        .search-filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-filters input { flex: 2; min-width: 180px; }
        .search-filters select { flex: 1; min-width: 140px; }
        #projects { display: grid; gap: 8px; max-height: 50vh; overflow-y: auto; padding-right: 4px; }
        .project-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px !important; text-align: left; }
        .project-info { flex: 1; cursor: pointer; }
        .project-info strong { display: block; font-size: 1.02rem; }
        .project-info span { display: block; margin-top: 4px; font-size: .86rem; }
        .type-badge { display: inline-block; padding: 2px 8px; margin-top: 6px; }
        .empty { padding: 24px 0; color: var(--rg-ink-3); text-align: center; }
        .close { margin-top: 18px; float: right; }

        @media (max-width: 980px) {
            .rg-home main.home#home-main { grid-template-columns: 1fr; }
        }
        @media (max-width: 560px) { .home-actions .action { width: 100%; justify-content: center; } .search-filters { flex-direction: column; } }
        }
    </style>
</head>
<body class="rg-home">
    <main class="home" id="home-main">
        <section class="home-intro" aria-labelledby="home-title">
            <span class="home-eyebrow rg-reveal-item">Renault Group · Ingénierie électrique véhicule</span>
            <h1 id="home-title" class="rg-reveal-item">Engineering Calculator Hub</h1>
            <p class="home-lede rg-reveal-item">Dimensionnement, autonomie batterie et analyse de mesures réunis dans un même projet, avec des calculs identiques aux classeurs Excel de référence.</p>
            <div class="home-actions actions rg-reveal-item">
                <button class="action primary" type="button" onclick="window.location.href='/import_project'">
                    Nouveau projet
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
                <button class="action" type="button" id="load-project">Sélectionner un projet existant</button>
            </div>
            <ul class="hub-tools rg-reveal-item" aria-label="Outils disponibles">
                <li><button type="button" class="hub-tool" data-tool="dcdc" aria-expanded="false">
                    <span class="hub-tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h3M8.5 8.5v3M14 10h3M7 15h10"/></svg></span>
                    <span class="hub-tool-title">DCDC Sizing / WLTC (-7 °C)</span><span class="hub-tool-arrow" aria-hidden="true">→</span>
                    <span class="hub-tool-desc">Bilans de courant, alternateur, PAO et GMV par profil d'homologation</span>
                    <span class="hub-tool-detail"><div><ul><li>Configuration</li><li>DCDC Sizing</li><li>WLTC (-7 °C)</li><li>PAO</li><li>GMV</li><li>Synthèse</li></ul><p>Ouvrez ou créez un projet, puis choisissez ce module dans « Modes d'analyse ».</p></div></span>
                </button></li>
                <li><button type="button" class="hub-tool" data-tool="auto" aria-expanded="false">
                    <span class="hub-tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2M6 11v2M10 11v2M14 11v2"/></svg></span>
                    <span class="hub-tool-title">Autonomie batterie</span><span class="hub-tool-arrow" aria-hidden="true">→</span>
                    <span class="hub-tool-desc">Modes DM, client, consommation fixe et veille</span>
                    <span class="hub-tool-detail"><div><ul><li>Batterie</li><li>Customer Mode</li><li>Mode DM</li><li>Consommations forfaitaires</li><li>Veille</li><li>Synthèses</li></ul><p>Ouvrez ou créez un projet, puis choisissez « Autonomie Batterie ».</p></div></span>
                </button></li>
                <li><button type="button" class="hub-tool" data-tool="bib" aria-expanded="false">
                    <span class="hub-tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span>
                    <span class="hub-tool-title">Biberonnage</span><span class="hub-tool-arrow" aria-hidden="true">→</span>
                    <span class="hub-tool-desc">Analyses 30 et 90 jours, SOC et recharges</span>
                    <span class="hub-tool-detail"><div><ul><li>Profil 30 jours</li><li>Profil 90 jours</li><li>SOC batterie</li><li>Recharges périodiques et sur seuil</li></ul><p>Accessible depuis le menu Autonomie batterie d'un projet.</p></div></span>
                </button></li>
                <li><button type="button" class="hub-tool" data-tool="logs" aria-expanded="false">
                    <span class="hub-tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 3-4 3 3 5-7"/></svg></span>
                    <span class="hub-tool-title">Analyse de logs</span><span class="hub-tool-arrow" aria-hidden="true">→</span>
                    <span class="hub-tool-desc">Acquisition ESP32-C3 multi INA226, CAN et numérique</span>
                    <span class="hub-tool-detail"><div><ul><li>Workstation</li><li>Acquisition</li><li>Import des logs</li><li>Dashboard</li></ul><p>Ouvrez ou créez un projet, puis choisissez « Analyse de logs ».</p></div></span>
                </button></li>
            </ul>
        </section>

        <section class="home-stage" aria-label="Projets récents">
            <canvas data-rg-hero3d aria-hidden="true"></canvas>
            <div class="recent">
                <div class="recent-head"><h2>Projets récents</h2><span id="project-count"></span></div>
                <div id="recent-projects"></div>
            </div>
        </section>
    </main>

    <dialog id="project-dialog">
        <h2>Projets existants</h2>

        <!-- BARRE DE RECHERCHE ET FILTRES -->
        <div class="search-filters">
            <input type="text" id="search-input" placeholder="Rechercher par nom, pilote, jalon…">
            <select id="type-filter">
                <option value="">Tous les types</option>
                <option value="ICE">ICE</option>
                <option value="ICE-VU">ICE - VU</option>
                <option value="ICE-X82ph3">ICE - VU - X82ph3</option>
                <option value="ICE-XDD">ICE - VU - XDD</option>
                <option value="EV">EV (Tous)</option>
                <option value="C-EV">EV - C-EV</option>
                <option value="VU">EV - VU</option>
                <option value="SUV">EV - SUV</option>
                <option value="EZ1">EV - EZ1</option>
                <option value="HHN">EV - HHN</option>
                <option value="FLEXEVAN">EV - VU - FLEXEVAN</option>
                <option value="SDV">EV - SDV</option>
                <option value="Sweet 400">EV - Sweet 400</option>
            </select>
        </div>

        <div id="projects"></div>
        <button class="close" type="button" id="close-dialog">Fermer</button>
    </dialog>

    <script src="/static/project_storage.js"></script>
    <script>
        const dialog = document.getElementById('project-dialog');
        const projectsContainer = document.getElementById('projects');
        const searchInput = document.getElementById('search-input');
        const typeFilter = document.getElementById('type-filter');
        const recentContainer = document.getElementById('recent-projects');
        const projectCount = document.getElementById('project-count');

        let allProjects = [];

        // Utilisateur, Administration et Déconnexion : bannière globale (rg-ui.js).
        fetch('/api/auth/me').then(response => response.json()).then(({ user }) => {
            if (!user) window.location.href = '/auth';
        }).catch(() => { window.location.href = '/auth'; });

        function projectTypeText(project) {
            const iceLabel = project.projectType === 'ICE' && project.iceProject === 'VU' && project.iceSubproject
                ? `VU - ${project.iceSubproject}`
                : project.iceProject || '';
            const evLabel = project.evArchitecture === 'VU' && project.evSubproject
                ? `VU - ${project.evSubproject}`
                : project.evArchitecture || 'Non spécifié';
            return project.projectType === 'EV'
                ? `EV (${evLabel})`
                : project.projectType === 'ICE' && iceLabel
                    ? `ICE (${iceLabel})`
                    : (project.projectType || 'ICE');
        }

        // Ouverture d'un projet : logique d'origine, partagée par la liste et les récents.
        async function openProject(project, statusElement, card) {
            if (statusElement) statusElement.textContent = 'Chargement des données...';
            card?.classList.add('is-opening');
            try {
                const restored = await ProjectStorage.restoreProject(project);
                sessionStorage.setItem('openedExistingProject', '1');
                window.location.href = restored.sourceRecovered ? '/select_components' : '/mode_selection';
            } catch (error) {
                card?.classList.remove('is-opening');
                alert(`Impossible de charger le projet : ${error.message}`);
            }
        }

        function renderRecent() {
            const projects = ProjectStorage.getProjects()
                .slice()
                .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
            projectCount.textContent = projects.length
                ? `${projects.length} projet${projects.length > 1 ? 's' : ''} sur ce poste`
                : '';
            recentContainer.replaceChildren();
            if (!projects.length) {
                const empty = document.createElement('p');
                empty.className = 'recent-empty';
                empty.textContent = 'Aucun projet enregistré sur ce poste. Créez un nouveau projet pour commencer.';
                recentContainer.append(empty);
                return;
            }
            projects.slice(0, 4).forEach((project, index) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'hub-project';
                item.dataset.type = projectTypeKey(project);
                item.style.setProperty('--i', String(index));
                const text = document.createElement('span');
                const name = document.createElement('strong');
                name.textContent = project.name || 'Projet sans nom';
                const meta = document.createElement('span');
                meta.className = 'hub-project-meta';
                const updated = project.updatedAt ? new Date(project.updatedAt) : null;
                if (project.milestone) meta.append(chip(ICON_FLAG, 'Jalon', project.milestone));
                if (project.pilotWattman) meta.append(chip(ICON_USER, 'Pilote', project.pilotWattman));
                if (updated && !Number.isNaN(updated.valueOf())) meta.append(chip(ICON_CLOCK, 'Modifié', updated.toLocaleDateString('fr-FR')));
                text.append(name, meta);
                const side = document.createElement('span');
                side.className = 'hub-project-side';
                const go = document.createElement('span');
                go.className = 'hub-project-go';
                go.setAttribute('aria-hidden', 'true');
                go.textContent = '→';
                side.append(typeBadge(project), go);
                item.append(text, side);
                item.title = `Ouvrir le projet « ${project.name || 'Projet sans nom'} »`;
                item.addEventListener('click', () => openProject(project, null, item));
                recentContainer.append(item);
            });
        }

        // Repères visuels des projets : couleur par motorisation, badge et puces d'information.
        const ICON_FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>';
        const ICON_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
        const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
        const ICON_EV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';
        const ICON_ICE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 6 6 10a6 6 0 0 1-12 0c0-2 1-3.5 2-5 .5 2 1.5 3 3 3-1-3 0-6 1-8z"/></svg>';
        function projectTypeKey(project) { return project.projectType === 'EV' ? 'ev' : 'ice'; }
        function typeBadge(project) {
            const badge = document.createElement('span');
            badge.className = 'hub-badge type-badge';
            const full = projectTypeText(project);
            const match = full.match(/^(\S+)\s*\((.*)\)$/);
            badge.innerHTML = projectTypeKey(project) === 'ev' ? ICON_EV : ICON_ICE;
            const main = document.createElement('b');
            main.textContent = match ? match[1] : full;
            badge.append(main);
            if (match) { const sub = document.createElement('span'); sub.textContent = match[2]; badge.append(sub); }
            badge.title = full;
            return badge;
        }
        function chip(icon, label, value) {
            const node = document.createElement('span');
            node.className = 'hub-chip';
            node.innerHTML = icon;
            const em = document.createElement('em');
            em.textContent = label;
            node.append(em, document.createTextNode(String(value)));
            return node;
        }

        function renderProjects() {
            const query = searchInput.value.trim().toLowerCase();
            const selectedType = typeFilter.value;

            const filtered = allProjects.filter(project => {
                const name = (project.name || '').toLowerCase();
                const pilot = (project.pilotWattman || '').toLowerCase();
                const milestone = (project.milestone || '').toLowerCase();
                const type = project.projectType || '';
                const arch = project.evArchitecture || '';
                const subproject = project.evSubproject || '';
                const iceProject = project.iceProject || '';
                const iceSubproject = project.iceSubproject || '';

                const matchesQuery = !query || name.includes(query) || pilot.includes(query) || milestone.includes(query);

                let matchesType = true;
                if (selectedType === 'ICE') matchesType = type === 'ICE';
                else if (selectedType === 'ICE-VU') matchesType = type === 'ICE' && iceProject === 'VU';
                else if (selectedType === 'ICE-X82ph3' || selectedType === 'ICE-XDD') {
                    matchesType = type === 'ICE' && iceProject === 'VU' && iceSubproject === selectedType.slice(4);
                }
                else if (selectedType === 'EV') matchesType = type === 'EV';
                else if (selectedType === 'C-EV' || selectedType === 'VU' || selectedType === 'SUV' || selectedType === 'EZ1' || selectedType === 'HHN') {
                    matchesType = type === 'EV' && arch === selectedType;
                }
                else if (selectedType === 'FLEXEVAN') {
                    matchesType = type === 'EV' && arch === 'VU' && subproject === selectedType;
                }
                else if (selectedType === 'SDV') matchesType = type === 'EV' && arch === 'SDV';
                else if (selectedType === 'Sweet 400') matchesType = type === 'EV' && arch === 'Sweet 400';

                return matchesQuery && matchesType;
            });

            projectsContainer.replaceChildren();

            if (!filtered.length) {
                projectsContainer.innerHTML = '<p class="empty">Aucun projet ne correspond à vos critères.</p>';
                return;
            }

            filtered.forEach((project) => {
                const card = document.createElement('div');
                card.className = 'project-card';

                const info = document.createElement('div');
                info.className = 'project-info';

                const name = document.createElement('strong');
                name.textContent = project.name || 'Projet sans nom';

                const details = document.createElement('span');
                details.textContent = `Date : ${project.date || 'N/C'} | Pilote : ${project.pilotWattman || 'N/C'} | Fiche : ${project.serverFilename || project.filename || 'Aucune'}`;

                card.dataset.type = projectTypeKey(project);
                info.append(name, details, typeBadge(project));

                // Clic sur les détails -> Charger le projet
                info.addEventListener('click', () => openProject(project, info.querySelector('span'), card));

                // Bouton de suppression
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.textContent = 'Supprimer';
                deleteBtn.title = 'Supprimer ce projet';
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (confirm(`Voulez-vous vraiment supprimer définitivement le projet "${project.name}" ?`)) {
                        await ProjectStorage.deleteProject(project);
                        // Recharge la liste fraîche depuis le stockage local
                        allProjects = ProjectStorage.getProjects();
                        renderProjects();
                        renderRecent();
                    }
                });

                card.append(info, deleteBtn);
                projectsContainer.appendChild(card);
            });
        }

        document.getElementById('load-project').addEventListener('click', () => {
            allProjects = ProjectStorage.getProjects();
            searchInput.value = '';
            typeFilter.value = '';
            renderProjects();
            dialog.showModal();
        });

        searchInput.addEventListener('input', renderProjects);
        typeFilter.addEventListener('change', renderProjects);

        document.getElementById('close-dialog').addEventListener('click', () => dialog.close());
        // Cartes outils : activation (onde lumineuse) et dépliage des sections réelles du module.
        document.querySelectorAll('.hub-tool').forEach(tool => tool.addEventListener('click', event => {
            const open = tool.getAttribute('aria-expanded') !== 'true';
            document.querySelectorAll('.hub-tool[aria-expanded="true"]').forEach(other => { if (other !== tool) other.setAttribute('aria-expanded', 'false'); });
            tool.setAttribute('aria-expanded', String(open));
            if (!window.RGUI?.reducedMotion()) {
                const rect = tool.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.className = 'hub-ripple';
                ripple.style.left = `${(event.clientX || rect.left + rect.width / 2) - rect.left}px`;
                ripple.style.top = `${(event.clientY || rect.top + rect.height / 2) - rect.top}px`;
                tool.append(ripple);
                ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
            }
        }));
        renderRecent();
    </script>
</body>
</html>
