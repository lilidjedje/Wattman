<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sélection des Composants</title>
    <style>
        :root { --navy: #1f4e78; --canvas: #edf3f7; --primary: #2563eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", Tahoma, sans-serif; background: var(--canvas); padding: 30px 20px; color: #1e293b; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: var(--navy); margin-bottom: 8px; font-size: 1.8rem; }
        p { color: #64748b; margin-bottom: 24px; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .toolbar-selection-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
        .select-all-wrap { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #475569; cursor: pointer; }
        .restore-defaults { padding: 8px 12px; border: 1px solid #bac8dd; border-radius: 7px; color: #20304a; background: #e8eef7; font: inherit; font-weight: 650; cursor: pointer; }
        .restore-defaults:hover { background: #dce5f2; }

        .table-wrap { overflow-x: auto; margin-bottom: 24px; border: 1px solid #cbd5e1; border-radius: 8px; max-height: 55vh; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: left; font-size: 0.95rem; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: var(--navy); font-weight: 700; position: sticky; top: 0; z-index: 10; }
        th:first-child, td:first-child { width: 42%; }
        th.selection-column, td.selection-column { width: 9%; text-align: center; }
        th.current-column, td.current-column { width: 20%; text-align: right; white-space: nowrap; }
        td.selection-column { padding-left: 8px; padding-right: 8px; }
        td.current-column { font-variant-numeric: tabular-nums; }
        tr:hover { background: #f1f5f9; }
        body.preserve-table-colors .table-wrap { color: #1e293b !important; background: #fff !important; border-color: #cbd5e1 !important; }
        body.preserve-table-colors table,
        body.preserve-table-colors table tbody,
        body.preserve-table-colors table tr,
        body.preserve-table-colors table td { color: #1e293b !important; background: #fff !important; }
        body.preserve-table-colors table th { color: #1f4e78 !important; background: #f8fafc !important; }
        body.preserve-table-colors table tbody tr:hover,
        body.preserve-table-colors table tbody tr:hover td { background: #f1f5f9 !important; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
        
        .badge-h { padding: 3px 8px; border-radius: 4px; background: #e0e7ff; color: #3730a3; font-weight: bold; font-size: 0.85rem; }
        .badge-s { padding: 3px 8px; border-radius: 4px; background: #fef3c7; color: #92400e; font-weight: bold; font-size: 0.85rem; }

        .actions { display: flex; justify-content: flex-end; gap: 12px; }
        .btn { padding: 11px 24px; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; font: inherit; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='industrial-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='modern-ui.css') }}">
    <script src="/static/current_units.js"></script>
    <script src="/static/wattman_current.js"></script>
    <!-- Design system Renault Engineering -->
    <link rel="stylesheet" href="/static/design-system/tokens.css">
    <link rel="stylesheet" href="/static/design-system/components.css">
    <script src="/static/design-system/rg-ui.js"></script>
    <script src="/static/design-system/rg-grid.js" defer></script>
</head>
<body class="preserve-table-colors">
    <main class="container">
        <h1 id="page-title">Sélection des composants</h1>
        <div class="toolbar">
            <div class="toolbar-selection-actions">
                <label class="select-all-wrap">
                    <input type="checkbox" id="select-all" checked> Tout sélectionner / Tout désélectionner
                </label>
                <button class="restore-defaults" type="button" id="restore-defaults">Restaurer la configuration de base</button>
            </div>
            <span id="counter" style="font-weight: 600; color: #475569;"></span>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th id="col-name">Device/ECU Name</th>
                        <th class="selection-column" scope="col" title="Inclure dans Homologation" aria-label="Inclure dans Homologation">H</th>
                        <th class="current-column" scope="col">Homologation Current</th>
                        <th class="selection-column" scope="col" title="Inclure dans Dark Current" aria-label="Inclure dans Dark Current">S</th>
                        <th class="current-column" scope="col">Dark Current</th>
                    </tr>
                </thead>
                <tbody id="component-tbody"></tbody>
            </table>
        </div>

        <div class="actions">
            <button class="btn btn-secondary" type="button" id="back-button">← Retour</button>
            <button class="btn btn-primary" type="button" id="save-selection">Enregistrer et continuer →</button>
        </div>
    </main>

    <script src="/static/project_storage.js"></script>
    <script>
        const excelData = JSON.parse(sessionStorage.getItem('excelData') || '{}');
        
        const titleEl = document.getElementById('page-title');
        const tbody = document.getElementById('component-tbody');
        const selectAllCheckbox = document.getElementById('select-all');
        const counterEl = document.getElementById('counter');
        function componentSelectionBackTarget(openedExistingProject) {
            return openedExistingProject ? '/' : null;
        }

        document.getElementById('back-button').addEventListener('click', () => {
            const target = componentSelectionBackTarget(sessionStorage.getItem('openedExistingProject') === '1');
            if (target) {
                sessionStorage.removeItem('openedExistingProject');
                window.location.href = target;
                return;
            }
            history.back();
        });

        titleEl.textContent = 'Sélection des composants';

        const sheet = excelData['Device List'] || excelData['ECU List'] || Object.values(excelData)[0];
        const storedHKeys = sessionStorage.getItem('selectedDeviceKeys');
        const storedSKeys = sessionStorage.getItem('selectedEcuKeys');
        const storedKnownKeys = sessionStorage.getItem('componentSelectionKnownKeys');
        const knownKeys = storedKnownKeys === null ? null : new Set(JSON.parse(storedKnownKeys));
        const selectedHSets = {
            H: storedHKeys !== null ? new Set(JSON.parse(storedHKeys)) : null,
            S: storedSKeys !== null ? new Set(JSON.parse(storedSKeys)) : null
        };

        function updateCounter() {
            const h = tbody.querySelectorAll('input[data-selection="H"]');
            const s = tbody.querySelectorAll('input[data-selection="S"]');
            const selectedH = Array.from(h).filter((checkbox) => checkbox.checked).length;
            const selectedS = Array.from(s).filter((checkbox) => checkbox.checked).length;
            counterEl.textContent = `Homologation : ${selectedH} / ${h.length} | Dark Current : ${selectedS} / ${s.length}`;
            const all = [...h, ...s];
            const selectedTotal = all.filter((checkbox) => checkbox.checked).length;
            selectAllCheckbox.checked = all.length > 0 && selectedTotal === all.length;
            selectAllCheckbox.indeterminate = selectedTotal > 0 && selectedTotal < all.length;
        }

        function rowValue(row, ...names) {
            const values = new Map(Object.entries(row || {}).map(([key, value]) => [
                key.trim().toLowerCase().replace(/[^a-z0-9]/g, ''),
                value
            ]));
            for (const name of names) {
                const value = values.get(name.toLowerCase().replace(/[^a-z0-9]/g, ''));
                if (value !== null && value !== undefined) return value;
            }
            return '';
        }

        function rowName(row) {
            const value = rowValue(row, 'Device Name', 'ECU Name');
            return value === null || value === undefined ? '' : String(value).trim();
        }

        function formatCurrent(value, sourceUnit) {
            if (window.CurrentUnits && value !== '' && value !== '-') return window.CurrentUnits.format(value,sourceUnit);
            const text = String(value ?? '').trim();
            if (!text || text === '-') return '-';
            const parsed = Number(text.replace(/\s/g, '').replace(',', '.'));
            if (!Number.isFinite(parsed)) return text;

            let current = parsed;
            let unit = sourceUnit;
            if (unit === 'A') {
                if (current !== 0 && Math.abs(current) < 1) {
                    current *= 1000;
                    unit = 'mA';
                    if (Math.abs(current) >= 999.995) {
                        current /= 1000;
                        unit = 'A';
                    }
                }
                if (current !== 0 && Math.abs(current) < 1) {
                    current *= 1000;
                    unit = 'µA';
                }
            } else {
                if (Math.abs(current) >= 999.995) {
                    current /= 1000;
                    unit = 'A';
                } else if (current !== 0 && Math.abs(current) < 1) {
                    current *= 1000;
                    unit = 'µA';
                }
            }
            return `${new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(current)} ${unit}`;
        }

        function updateCurrentCell(currentCell, checkbox) {
            currentCell.textContent = checkbox.checked ? currentCell.dataset.value : '-';
        }

        function restoreDefaultSelections(checkboxes) {
            checkboxes.forEach(checkbox => {
                checkbox.checked = checkbox.dataset.defaultChecked === 'true';
            });
        }

        function formatDarkCurrent(milliampValue, ampValue) {
            return milliampValue !== '' && milliampValue !== '-'
                ? formatCurrent(milliampValue, 'mA')
                : formatCurrent(ampValue, 'A');
        }

        function updateRowCurrentCells(row) {
            row.querySelectorAll('td[data-current-selection]').forEach(currentCell => {
                const checkbox = row.querySelector(`input[data-selection="${currentCell.dataset.currentSelection}"]`);
                if (checkbox) updateCurrentCell(currentCell, checkbox);
            });
        }

        if (sheet && sheet.data) {
            sheet.data.forEach((row, rowIndex) => {
                // Lecture de la catégorie (colonne current_category)
                const cat = String(rowValue(row, 'current_category', 'Current Category') || '').trim().toUpperCase();
                const name = rowName(row);
                if (!name) return;
                const homologationRaw = rowValue(row, 'Current (A)', 'Homologation Current (A)');
                const darkMilliampRaw = rowValue(row, 'Sleep Current (mA)', 'DM1 Current (mA)', 'Homologation Current (mA)');
                const darkAmpRaw = rowValue(row, 'Current (A)', 'Homologation Current (A)');
                const sourceColumn = cat === 'S' && darkMilliampRaw !== '' ? ['Sleep Current (mA)','DM1 Current (mA)','Homologation Current (mA)'].find(key=>row[key]!=null) : row['Current (A)']!=null?'Current (A)':'Homologation Current (A)';
                const reading = WattmanCurrent.read(row,sourceColumn || 'Current (A)',cat);
                const homologationCurrent = formatCurrent(WattmanCurrent.read(row,row['Current (A)']!=null?'Current (A)':'Homologation Current (A)','H').amperes, 'A');
                const darkCurrent = formatCurrent(reading.microamps, '\u00b5A');
                const key = `${rowIndex}_${name}`;
                const isKnownKey = knownKeys?.has(key);
                const homologationChecked = isKnownKey && selectedHSets.H !== null
                    ? selectedHSets.H.has(key)
                    : cat === 'H';
                const darkChecked = isKnownKey && selectedHSets.S !== null
                    ? selectedHSets.S.has(key)
                    : cat === 'S';

                const tr = document.createElement('tr');
                const nameCell = document.createElement('td');
                const nameLabel = document.createElement('strong');
                nameLabel.textContent = name;
                nameCell.appendChild(nameLabel);
                if(reading.suspicious) {
                    const warning=document.createElement('small');warning.textContent=' ⚠ '+reading.reason;
                    warning.style.cssText='display:block;color:#a4262c;font-weight:600';nameCell.append(warning);
                }
                tr.appendChild(nameCell);

                [['H', homologationChecked], ['S', darkChecked]].forEach(([selection, checked]) => {
                    const cell = document.createElement('td');
                    cell.className = 'selection-column';
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.dataset.key = key;
                    checkbox.dataset.selection = selection;
                    checkbox.dataset.defaultChecked = String(selection === 'H' ? cat === 'H' : cat === 'S');
                    checkbox.checked = checked;
                    checkbox.setAttribute('aria-label', `Inclure ${name} dans ${selection === 'H' ? 'Homologation' : 'Dark Current'}`);
                    cell.appendChild(checkbox);
                    tr.appendChild(cell);

                    const currentCell = document.createElement('td');
                    currentCell.className = 'current-column';
                    currentCell.dataset.currentSelection = selection;
                    currentCell.dataset.value = selection === 'H' ? homologationCurrent : darkCurrent;
                    tr.appendChild(currentCell);
                });
                updateRowCurrentCells(tr);
                tbody.appendChild(tr);
            });
        }

        updateCounter();

        selectAllCheckbox.addEventListener('change', (e) => {
            const checkboxes = tbody.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = e.target.checked);
            tbody.querySelectorAll('tr').forEach(updateRowCurrentCells);
            updateCounter();
            saveSelection();
        });

        document.getElementById('restore-defaults').addEventListener('click', () => {
            restoreDefaultSelections(tbody.querySelectorAll('input[data-selection]'));
            tbody.querySelectorAll('tr').forEach(updateRowCurrentCells);
            updateCounter();
            saveSelection();
        });

        function saveSelection() {
            const selected = { H: [], S: [] };
            const known = new Set();
            tbody.querySelectorAll('input[data-key]').forEach(checkbox => known.add(checkbox.dataset.key));
            tbody.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
                selected[checkbox.dataset.selection].push(checkbox.dataset.key);
            });
            sessionStorage.setItem('selectedDeviceKeys', JSON.stringify(selected.H));
            sessionStorage.setItem('selectedEcuKeys', JSON.stringify(selected.S));
            sessionStorage.setItem('componentSelectionKnownKeys', JSON.stringify([...known]));
        }
        tbody.addEventListener('change', event => {
            const checkbox = event.target.closest('input[data-selection]');
            if (checkbox) updateRowCurrentCells(checkbox.closest('tr'));
            updateCounter();
            saveSelection();
        });

        document.getElementById('save-selection').addEventListener('click', () => {
            const checkboxes = tbody.querySelectorAll('input[type="checkbox"]');
            const newSelectedKeys = { H: [], S: [] };
            
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    const selection = cb.getAttribute('data-selection');
                    if (newSelectedKeys[selection]) newSelectedKeys[selection].push(cb.getAttribute('data-key'));
                }
            });

            sessionStorage.setItem('selectedDeviceKeys', JSON.stringify(newSelectedKeys.H));
            sessionStorage.setItem('selectedEcuKeys', JSON.stringify(newSelectedKeys.S));
            saveSelection();

            // Redirection vers le menu de sélection des modes
            window.location.href = '/mode_selection';
        });
    </script>
    <script src="/static/app_summary.js" data-items="homologation,mode,home"></script>
</body>
</html>
