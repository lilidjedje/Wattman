<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export des synthèses PDF</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 62px 20px 30px; color: #f6f2e8; background: #090a0b; }
        .export-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 16px 20px; background: #111314; border-left: 5px solid #b7830b; border-bottom: 1px solid #4a4e50; }
        .export-header h1 { margin: 0; text-align: center; }
        .export-header .back { justify-self: start; }
        .export-header .download { justify-self: end; }
        button, .back { padding: 11px 18px; color: #fff8df; background: #775300; border: 1px solid #9a7009; font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        .status { min-height: 28px; margin: 16px 0; padding: 8px 12px; color: #f5cf49; background: #141617; border-left: 4px solid #b7830b; }
        .preview-grid { display: grid; gap: 22px; }
        .preview { padding: 12px; background: #141617; border: 1px solid #484c4e; border-left: 4px solid #b7830b; }
        .preview h2 { margin: 0 0 10px; color: #fff8df; }
        iframe { width: 100%; height: 520px; border: 1px solid #626769; background: #fff; }
        @media (max-width: 800px) {
            .export-header { grid-template-columns: 1fr auto; }
            .export-header h1 { grid-column: 1 / -1; grid-row: 1; }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='industrial-theme.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body class="pdf-export-page">
    <header class="export-header">
        <a class="back" href="/mode_selection">← Retour</a>
        <h1>Export des synthèses du projet</h1>
        <button class="download" id="download-pdf" type="button" disabled>Télécharger le PDF</button>
    </header>
    <div class="status" id="export-status">Chargement des synthèses et des graphiques…</div>
    <main class="preview-grid">
        <section class="preview"><h2>DCDC Sizing / WLTC (-7 °C)</h2><iframe data-report="dcdc" title="Synthèse DCDC et WLTC (-7 °C)" src="/synthesis?export=1"></iframe></section>
        <section class="preview"><h2>Autonomie DM1</h2><iframe data-report="dm1" title="Synthèse DM1" src="/dm_results?mode=DM1&export=1"></iframe></section>
        <section class="preview"><h2>Autonomie DM2</h2><iframe data-report="dm2" title="Synthèse DM2" src="/dm_results?mode=DM2&export=1"></iframe></section>
        <section class="preview"><h2>Autonomie Customer Mode</h2><iframe data-report="customer" title="Synthèse Customer Mode" src="/battery_results_menu?mode=Customer%20Mode&export=1"></iframe></section>
        <section class="preview"><h2>Biberonnage</h2><iframe data-report="biberonnage" title="Synthèse Biberonnage" src="/biberonnage/resultats?export=1"></iframe></section>
    </main>

    <script src="/static/project_storage.js"></script>
    <script>
        const bibDays = sessionStorage.getItem('biberonnageDurationDays') === '90' ? 90 : 30;
        document.querySelector('iframe[data-report="biberonnage"]').src = `/biberonnage/resultats?export=1&days=${bibDays}`;
        const frames = [...document.querySelectorAll('iframe[data-report]')];
        const statusElement = document.getElementById('export-status');
        const downloadButton = document.getElementById('download-pdf');
        const reportNames = {
            dcdc: 'Synthèse DCDC Sizing / WLTC (-7 °C)', dm1: 'Synthèse Autonomie DM1',
            dm2: 'Synthèse Autonomie DM2', customer: 'Synthèse Autonomie Customer Mode',
            biberonnage: 'Synthèse Biberonnage'
        };

        const delay = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));

        function prepareFrame(frame) {
            const documentFrame = frame.contentDocument;
            const style = documentFrame.createElement('style');
            style.textContent = `
                body::before, body::after, .retractable-menu, .button-group, .bottom-nav,
                .toolbar, .creator, dialog, .btn-back, .close-modal { display:none !important; }
                body { padding:12px !important; overflow:visible !important; }
                .tab-content { display:block !important; }
                .card-tabs { display:none !important; }
                .chart-container { display:block !important; height:320px !important; }
                #customer-export-reports { display:block !important; width:100% !important; padding:0 !important; }
                .pdf-customer-report { margin:0 0 28px; padding:12px; background:#fff; color:#111827; break-after:page; }
                .pdf-customer-report h2 { color:#111827 !important; }
            `;
            documentFrame.head.appendChild(style);
            frame.contentWindow.dispatchEvent(new Event('resize'));
        }

        function reportElements(frame) {
            const documentFrame = frame.contentDocument;
            const type = frame.dataset.report;
            if (type === 'customer') return [...documentFrame.querySelectorAll('.pdf-customer-report')];
            if (type === 'biberonnage') return [...documentFrame.querySelectorAll('.analysis')];
            if (type === 'dm1' || type === 'dm2') return [...documentFrame.querySelectorAll('.profile')];
            return [documentFrame.body];
        }

        async function appendCanvasToPdf(pdf, canvas, heading, state) {
            const margin = 8;
            const imageWidthMm = 210 - margin * 2;
            const pixelsPerMm = canvas.width / imageWidthMm;
            let sourceY = 0;
            let firstSlice = true;

            while (sourceY < canvas.height) {
                const titleSpace = firstSlice ? 13 : 0;
                const availableHeightMm = 297 - margin * 2 - titleSpace;
                const sliceHeightPx = Math.min(canvas.height - sourceY, Math.floor(availableHeightMm * pixelsPerMm));
                const slice = document.createElement('canvas');
                slice.width = canvas.width;
                slice.height = sliceHeightPx;
                slice.getContext('2d').drawImage(canvas, 0, sourceY, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

                if (state.hasPage) pdf.addPage();
                state.hasPage = true;
                if (firstSlice) {
                    pdf.setFont('times', 'bold');
                    pdf.setFontSize(14);
                    pdf.text(heading, margin, margin + 5);
                }
                const y = margin + titleSpace;
                pdf.addImage(slice.toDataURL('image/jpeg', .9), 'JPEG', margin, y, imageWidthMm, sliceHeightPx / pixelsPerMm, undefined, 'FAST');
                sourceY += sliceHeightPx;
                firstSlice = false;
            }
        }

        async function generatePdf() {
            downloadButton.disabled = true;
            statusElement.textContent = 'Création du PDF en cours…';
            try {
                if (!window.html2canvas || !window.jspdf?.jsPDF) throw new Error('Les bibliothèques PDF ne sont pas disponibles. Vérifiez la connexion réseau.');
                const pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
                const state = { hasPage: false };

                for (const frame of frames) {
                    const elements = reportElements(frame);
                    for (let index = 0; index < elements.length; index += 1) {
                        statusElement.textContent = `Capture : ${reportNames[frame.dataset.report]} (${index + 1}/${elements.length})…`;
                        const element = elements[index];
                        const canvas = await html2canvas(element, {
                            scale: 1,
                            useCORS: true,
                            backgroundColor: '#ffffff',
                            logging: false,
                            width: Math.max(element.scrollWidth, element.clientWidth),
                            height: Math.max(element.scrollHeight, element.clientHeight),
                            windowWidth: Math.max(frame.contentDocument.documentElement.scrollWidth, 1500)
                        });
                        await appendCanvasToPdf(pdf, canvas, reportNames[frame.dataset.report], state);
                    }
                }
                const activeProject = JSON.parse(localStorage.getItem('activeProject') || 'null');
                const safeName = String(activeProject?.name || 'projet').replace(/[^a-z0-9_-]+/gi, '-');
                pdf.save(`syntheses-${safeName}.pdf`);
                statusElement.textContent = 'PDF généré avec succès.';
            } catch (error) {
                console.error(error);
                statusElement.textContent = `Erreur : ${error.message}`;
            } finally {
                downloadButton.disabled = false;
            }
        }

        Promise.all(frames.map(frame => new Promise(resolve => {
            if (frame.contentDocument?.readyState === 'complete') resolve();
            else frame.addEventListener('load', resolve, { once: true });
        }))).then(async () => {
            await delay(1500);
            frames.forEach(prepareFrame);
            await delay(1200);
            downloadButton.disabled = false;
            statusElement.textContent = 'Toutes les synthèses sont prêtes.';
            if (new URLSearchParams(window.location.search).get('auto') === '1') generatePdf();
        });

        downloadButton.addEventListener('click', generatePdf);
    </script>
</body>
</html>
